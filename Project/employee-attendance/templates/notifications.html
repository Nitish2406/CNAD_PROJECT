{% extends "base.html" %}
{% block title %}Notifications · Employee Attendance & Leave{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-bell-fill"></i> Notifications</h4>

<div class="card panel-card">
  <div class="card-body">
    {% for n in items %}
    <div class="d-flex align-items-start gap-3 py-3 {% if not loop.last %}border-bottom{% endif %}">
      <i class="bi bi-bell-fill text-primary fs-5"></i>
      <div>
        <div>{{ n.message }}</div>
      </div>
    </div>
    {% else %}
    <div class="text-center text-muted py-4">
      <i class="bi bi-bell-slash fs-3 d-block mb-2"></i>
      No notifications yet.
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
