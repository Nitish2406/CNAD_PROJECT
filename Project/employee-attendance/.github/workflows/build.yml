name: Build

# Minimal CI/CD for Review 2: on every push, install deps, sanity-check
# the app imports cleanly, then build the Docker image. Deployment,
# automated tests and multi-stage pipelines are planned for a later phase.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check — app imports without errors
        run: |
          python -c "import app; print('app.py imported successfully')"

      - name: Build Docker image
        run: docker build -t employee-attendance:ci .
